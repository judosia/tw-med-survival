<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>ACLS 快速處置｜醫院生存 note</title>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@300;400;500;700;900&family=Inter:wght@400;500;600&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="../shared.css"/>
  <style>
    body { padding-top: var(--nav-h); }
    .simple-nav {
      position: fixed; top: 0; left: 0; right: 0; z-index: 300;
      background: rgba(13,31,60,0.97);
      backdrop-filter: blur(10px);
      height: var(--nav-h); padding: 0 5%;
      display: flex; align-items: center; gap: 12px;
      border-bottom: 1px solid rgba(255,255,255,0.07);
    }
    .entry-wrap {
      max-width: 1200px;
      margin: 0 auto;
      padding: 40px 5% 100px;
    }
    .entry-hero { margin-bottom: 32px; }
    .entry-hero h1 {
      font-size: clamp(1.6rem, 3vw, 2.2rem);
      font-weight: 900; color: var(--navy); margin-bottom: 8px;
    }
    .entry-hero p {
      font-size: 0.88rem; color: var(--muted); max-width: 1200px; line-height: 1.7;
    }

    :root {
      --navy: #183153;
      --blue: #3b6ea8;
      --red: #d94b55;
      --orange: #d88a31;
      --green: #408a67;
      --yellow: #f5b942;
      --light: #f6f8fb;
      --white: #ffffff;
      --border: #dde3ea;
      --muted: #778391;
      --text: #344454;
    }

    body {
      background: #f7f9fc;
      color: var(--text);
    }

    /* ===== PAGE ===== */

    .acls-page {
      width: min(1000px, 92%);
      margin: 0 auto;
      padding: 45px 0 80px;
    }

    .acls-title {
      font-size: 2rem;
      font-weight: 900;
      color: var(--navy);
      margin-bottom: 6px;
    }

    .acls-subtitle {
      font-size: 0.9rem;
      color: var(--muted);
      margin-bottom: 28px;
    }


    /* ===== ACLS ACTION SYSTEM ===== */

.acls-action {
  min-height: 52px;
  padding: 10px 14px;
  border-radius: 10px;
  border: 1px solid transparent;

  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;

  font-size: .86rem;
}

.acls-action strong {
  font-weight: 900;
}

.acls-action span,
.acls-action small {
  font-size: .76rem;
  opacity: .78;
}


/* CPR */

.action-cpr {
  background: #f1f3f5;
  border-color: #d7dce1;
  color: #495057;
}


/* EPINEPHRINE */

.action-epi {
  background: #fff2df;
  border-color: #f0c27b;
  color: #9a5b00;
}


/* AMIODARONE */

.action-amio {
  background: #fff0f5;
  border-color: #edb6ca;
  color: #a23d65;
}


/* SHOCK */

.action-shock {
  background: #fff3a8;
  border: 2px solid #e8b72e;
  color: #6f5200;

  box-shadow:
    0 3px 0 #d9a91e,
    0 6px 14px rgba(232,183,46,.16);

  cursor: pointer;
  transition:
    transform .15s ease,
    box-shadow .15s ease;
}

.action-shock:hover {
  transform: translateY(-2px);

  box-shadow:
    0 5px 0 #d9a91e,
    0 9px 20px rgba(232,183,46,.25);
}

.action-shock:active {
  transform: translateY(2px);

  box-shadow:
    0 1px 0 #d9a91e;
}


    /* ===== HIGHLIGHT CARDS ===== */

    .danger-card {
      background: #fff7f7;
      border-left: 5px solid var(--red);
    }

    .shock-card {
      background: #fffaf1;
      border-left: 5px solid var(--orange);
    }

    .action-card {
      background: #f4f8ff;
      border-left: 5px solid var(--blue);
    }

    .success-card {
      background: #f3faf6;
      border-left: 5px solid var(--green);
    }


    /* ===== BADGES ===== */

    .badge {
      display: inline-block;
      padding: 3px 8px;
      border-radius: 5px;
      font-size: 0.72rem;
      font-weight: 800;
      margin-right: 5px;
    }

    .badge-red {
      background: #ffe4e6;
      color: var(--red);
    }

    .badge-blue {
      background: #e8f0fb;
      color: var(--blue);
    }

    .badge-yellow {
      background: #fffdda;
      color: #d2c61b;
    }

    .badge-green {
      background: #e1f3e8;
      color: var(--green);
    }


    /* ===== FLOW ===== */

    .flow {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .flow-step {
      padding: 11px 14px;
      border-radius: 8px;
      background: var(--light);
      border: 1px solid var(--border);
      font-size: 0.86rem;
      line-height: 1.5;
    }

    .flow-arrow {
      text-align: center;
      color: var(--muted);
      font-weight: 800;
      line-height: 1;
    }

    .flow-step.critical {
      background: #fff5f5;
      border-color: rgba(217, 75, 85, 0.35);
      color: #8d3038;
      font-weight: 700;
    }


    /* ===== TABLE ===== */

    .acls-table-wrap {
      overflow-x: auto;
    }

    .acls-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.82rem;
    }

    .acls-table th {
      text-align: left;
      background: var(--light);
      color: var(--navy);
      font-weight: 800;
    }

    .acls-table th,
    .acls-table td {
      padding: 10px 12px;
      border-bottom: 1px solid var(--border);
      vertical-align: top;
    }


    /* ===== GRID ===== */

    .acls-grid-2 {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }


    /* ===== NOTE ===== */

    .acls-note {
      font-size: 0.78rem;
      line-height: 1.6;
      color: var(--muted);
    }


    /* ===== MOBILE ===== */

    @media (max-width: 700px) {

      .acls-page {
        width: 92%;
        padding-top: 28px;
      }

      .acls-title {
        font-size: 1.6rem;
      }

      .acls-quick-nav {
        grid-template-columns: 1fr;
      }

      .acls-grid-2 {
        grid-template-columns: 1fr;
      }

    }
  </style>
</head>

<body>

<nav class="simple-nav">
  <a href="../index.html" class="nav-back">← 首頁</a>
  <span class="nav-sep">/</span>
  <span class="nav-current">ACLS</span>
</nav>

<main class="acls-page">

  <div class="acls-action action-shock">
  <span class="action-icon">⚡</span>
  <div>
    <strong>SHOCK</strong>
    <small>Biphasic 200 J</small>
  </div>
</div>

<div class="flow-arrow">↓</div>

<div class="acls-action action-cpr">
  <strong>CPR</strong>
  <span>2 min</span>
</div>

<div class="flow-arrow">↓</div>

<div class="acls-action action-epi">
  <strong>Epinephrine</strong>
  <span>1 mg IV/IO · q3–5 min</span>
</div>

<div class="flow-arrow">↓</div>

<div class="acls-action action-amio">
  <strong>Amiodarone</strong>
  <span>300 mg → 150 mg</span>
</div>


  <!-- ============================================================
       FINAL NOTE
  ============================================================= -->

  <div class="acls-card warning-card">

    <div class="acls-card-title">
      ⚠ 使用提醒
    </div>

    <p class="acls-note">
      本頁定位為醫療人員值班快速複習工具，並不能取代完整 ACLS algorithm、
      院內急救流程或即時臨床判斷。電擊能量、藥物配置、infusion preparation、
      post-ROSC temperature management 等細節應依院內 protocol 與實際設備處理。
    </p>

  </div>


</main>

</body>
</html>
